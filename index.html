<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>auth-test</title>
    <style>   
        #container {
            width: 100%;
            background-color: aqua;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 80px;
        }
    </style>
</head>
<body>
    <h2>Add product</h2>
    <form id="productSub" action="submit">
        <input id="pr-name" type="text" placeholder="Product name" required>
        <input id="pr-quantity" type="number" placeholder="Quantity" required>
        <input id="pr-price" type="number" placeholder="Price" required>
        <button type="submit">submit</button>
    </form>
    <div id="container">
        <h1>Loading...</h1>
    </div>
</body>
<script>
    const form = document.getElementById('productSub')

    form.addEventListener("submit", async e => {
        e.preventDefault();

        const name = document.getElementById("pr-name").value;
        const quantity = document.getElementById("pr-quantity").value
        const price = document.getElementById("pr-price").value;

        const response = await fetch('/api/products', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({name, quantity: Number(quantity), price: Number(price)})
        })

        const result = await response.json();
        console.log("Server response :",result)
        alert("Product added")
    })

    const updateProductQuantity = async (productId, currentQuant) =>{

        const newQuantity = prompt("Enter New quantity:", currentQuant)

        if (newQuantity == null || newQuantity == currentQuant) return;

        try {
            const response = await fetch (`/api/products/${productId}`, {
                method: "PUT",
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({quantity: Number(newQuantity)})
            })

            //check if response is json
            const result = await response.json();

            if (response.ok) {
                alert("Product updated")
                displayProduct()
            } else {
                alert("Error :" + (result.message || response.statusText))
            }
            
        } catch (error) {
            console.error("update failed:", error)
        }
    }


    const deleteProduct = async (productId) => {

        if (!confirm("Are you sire you want to delete this product?")) return;

        try {
            const response = await fetch(`/api/products/${productId}`, {
                method: "DELETE"
            })

            if (response.ok) {
                alert("Product deleted successfully!")
                displayProduct()
            } else {
                const error = await response.json();
                alert("Error: " + error.message)
            }

        } catch (error) {
            console.error("Delete failed:", error)
        }
    }

    const displayProduct = async () =>  {
      try {
          const response = await fetch('/api/products')
          const products = await response.json()

          const container = document.getElementById('container');

          container.innerHTML = '';

          products.forEach(product => {
            const productDiv = document.createElement('div')
            productDiv.classList.add('product-item')

            productDiv.innerHTML = `
                <h3>${product.name}</h3>
                <p> Quantity : <strong>${product.quantity}</strong><p>
                <p> Price :${product.price}$</p>

                <button onclick="updateProductQuantity('${product._id}', ${product.quantity})">
                    Edit the quantity
                </button>
                <button onclick="deleteProduct('${product._id}')">
                    Delete the product
                </button>
                `

             container.appendChild(productDiv)
          });
        
      } catch (error) {
        console.error("Error fetching products: ",error)
        document.getElementById("container").innerHTML= "Failed to load products"
      }
    }

    displayProduct()
</script>
</html>
